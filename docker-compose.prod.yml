# Production overlay for a live domain:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires a .env file (copy .env.example). Missing secrets stop the deploy here, and the API
# refuses to start with insecure settings (backend/app/config.py).

x-prod-backend-env: &prod-backend-env
  VROS_ENVIRONMENT: production
  VROS_PUBLIC_URL: ${VROS_PUBLIC_URL:?set VROS_PUBLIC_URL, e.g. https://vros.verkies.co}
  VROS_SECRET_KEY: ${VROS_SECRET_KEY:?set VROS_SECRET_KEY (openssl rand -hex 32)}
  VROS_DATABASE_URL: postgresql+psycopg://vros:${VROS_DB_PASSWORD:?set VROS_DB_PASSWORD}@postgres:5432/vros
  VROS_REDIS_URL: redis://redis:6379/0
  VROS_LOG_LEVEL: ${VROS_LOG_LEVEL:-INFO}
  VROS_AI_PROVIDER: ${VROS_AI_PROVIDER:-none}
  VROS_OLLAMA_MODEL: ${VROS_OLLAMA_MODEL:-granite4.2:8b}
  VROS_TASK_DUE_BUSINESS_DAYS: ${VROS_TASK_DUE_BUSINESS_DAYS:-2}
  VROS_STALE_OPPORTUNITY_DAYS: ${VROS_STALE_OPPORTUNITY_DAYS:-14}
  VROS_INACTIVE_DEAL_DAYS: ${VROS_INACTIVE_DEAL_DAYS:-21}
  VROS_EMAIL_SENDING_ENABLED: ${VROS_EMAIL_SENDING_ENABLED:-false}
  VROS_EMAIL_COMPANY_NAME: ${VROS_EMAIL_COMPANY_NAME:-Verkies}
  VROS_EMAIL_POSTAL_ADDRESS: ${VROS_EMAIL_POSTAL_ADDRESS:-}
  VROS_LINKEDIN_DAILY_LIMIT: ${VROS_LINKEDIN_DAILY_LIMIT:-15}
  VROS_LINKEDIN_WEEKLY_LIMIT: ${VROS_LINKEDIN_WEEKLY_LIMIT:-80}
  VROS_CLIENT_QUIET_YELLOW_DAYS: ${VROS_CLIENT_QUIET_YELLOW_DAYS:-30}
  VROS_CLIENT_QUIET_RED_DAYS: ${VROS_CLIENT_QUIET_RED_DAYS:-60}
  VROS_CLIENT_MILESTONE_RED_DAYS: ${VROS_CLIENT_MILESTONE_RED_DAYS:-14}
  VROS_CLIENT_FEEDBACK_DAYS: ${VROS_CLIENT_FEEDBACK_DAYS:-90}
  VROS_CLIENT_UNANSWERED_MESSAGES: ${VROS_CLIENT_UNANSWERED_MESSAGES:-3}
  VROS_LEARNING_MIN_SAMPLE: ${VROS_LEARNING_MIN_SAMPLE:-5}
  VROS_DOCUMENT_MAX_BYTES: ${VROS_DOCUMENT_MAX_BYTES:-10485760}
  VROS_COMPANIES_HOUSE_API_KEY: ${VROS_COMPANIES_HOUSE_API_KEY:-}
  VROS_WIKIDATA_ENABLED: ${VROS_WIKIDATA_ENABLED:-true}
  VROS_SRA_API_KEY: ${VROS_SRA_API_KEY:-}
  VROS_WEBSITE_ARCHIVE_ENABLED: ${VROS_WEBSITE_ARCHIVE_ENABLED:-true}
  VROS_SEARCH_PROVIDER: ${VROS_SEARCH_PROVIDER:-none}
  VROS_SEARXNG_URL: ${VROS_SEARXNG_URL:-http://searxng:8080}
  VROS_RATE_LIMIT_LOGIN_PER_IP: ${VROS_RATE_LIMIT_LOGIN_PER_IP:-20}
  VROS_RATE_LIMIT_INVITE_PER_IP: ${VROS_RATE_LIMIT_INVITE_PER_IP:-20}
  VROS_RATE_LIMIT_PASSWORD_CHANGES_PER_HOUR: ${VROS_RATE_LIMIT_PASSWORD_CHANGES_PER_HOUR:-10}
  VROS_RATE_LIMIT_RESEARCH_PER_HOUR: ${VROS_RATE_LIMIT_RESEARCH_PER_HOUR:-120}
  VROS_RATE_LIMIT_API_PER_MINUTE: ${VROS_RATE_LIMIT_API_PER_MINUTE:-1200}
  VROS_BREACHED_PASSWORD_CHECK: ${VROS_BREACHED_PASSWORD_CHECK:-true}
  VROS_API_WORKERS: ${VROS_API_WORKERS:-2}
  VROS_WORKER_CONCURRENCY: ${VROS_WORKER_CONCURRENCY:-2}

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${VROS_DB_PASSWORD:?set VROS_DB_PASSWORD}
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  migrate:
    environment: *prod-backend-env

  api:
    restart: unless-stopped
    environment: *prod-backend-env
    ports: !reset []

  worker:
    restart: unless-stopped
    environment: *prod-backend-env

  frontend:
    restart: unless-stopped

  caddy:
    restart: unless-stopped
    environment:
      VROS_SITE_ADDRESS: ${VROS_SITE_ADDRESS:?set VROS_SITE_ADDRESS to the public hostname, e.g. vros.verkies.co}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  # Nightly dump and documents archive, encrypted off-site copy, weekly restore test
  # (ops/backup/backup.sh). Off-site copies need VROS_BACKUP_AGE_RECIPIENT and an rclone
  # "offsite" remote: see docs/DEPLOY_HETZNER.md §7.
  backup:
    build: ./ops/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: vros
      PGDATABASE: vros
      PGPASSWORD: ${VROS_DB_PASSWORD:?set VROS_DB_PASSWORD}
      VROS_BACKUP_KEEP_DAYS: ${VROS_BACKUP_KEEP_DAYS:-14}
      VROS_BACKUP_OFFSITE_KEEP_DAYS: ${VROS_BACKUP_OFFSITE_KEEP_DAYS:-30}
      VROS_BACKUP_DRILL_WEEKDAY: ${VROS_BACKUP_DRILL_WEEKDAY:-7}
      VROS_BACKUP_AGE_RECIPIENT: ${VROS_BACKUP_AGE_RECIPIENT:-}
      VROS_BACKUP_REMOTE_PATH: ${VROS_BACKUP_REMOTE_PATH:-}
      # The rclone remote named "offsite", e.g. a Hetzner Storage Box (sftp) or any S3 bucket.
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_HOST: ${RCLONE_CONFIG_OFFSITE_HOST:-}
      RCLONE_CONFIG_OFFSITE_PORT: ${RCLONE_CONFIG_OFFSITE_PORT:-}
      RCLONE_CONFIG_OFFSITE_USER: ${RCLONE_CONFIG_OFFSITE_USER:-}
      RCLONE_CONFIG_OFFSITE_PASS: ${RCLONE_CONFIG_OFFSITE_PASS:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
      - storage:/data/storage:ro
    depends_on:
      postgres: { condition: service_healthy }
      # backup_runs must exist before the first cycle records into it.
      migrate: { condition: service_completed_successfully }

volumes:
  backups:
