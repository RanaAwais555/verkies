# Prometheus for VROS (slice 7.1): the "observability" Compose profile.
# Scrapes the API's /metrics on the Docker network (never through Caddy) and evaluates
# alerts.yml. Alerts show in Prometheus and Grafana; nothing is sent anywhere.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vros-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
